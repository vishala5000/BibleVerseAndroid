name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;36.0.0"

      - name: Download Piper Android CLI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/piper-deb /tmp/piper-extract
          gh release download v1.2-android-termux \
            --repo gyroing/piper-tts-for-termux \
            --pattern '*.deb' \
            --dir /tmp/piper-deb
          deb=$(find /tmp/piper-deb -name '*.deb' | head -n1)
          test -n "$deb"
          dpkg-deb -x "$deb" /tmp/piper-extract

          piper=$(find /tmp/piper-extract -type f -name piper -perm -111 | head -n1)
          test -n "$piper"
          mkdir -p app/src/main/assets/piper/bin app/src/main/assets/piper/lib app/src/main/assets/piper/espeak-ng-data
          cp "$piper" app/src/main/assets/piper/bin/piper

          # Copy the runtime libraries shipped with the package.
          find /tmp/piper-extract/usr/lib -type f \( -name '*.so' -o -name '*.so.*' \) -exec cp -L {} app/src/main/assets/piper/lib/ \; || true

          # Copy eSpeak data if the package contains it.
          if [ -d /tmp/piper-extract/usr/share/espeak-ng-data ]; then
            cp -a /tmp/piper-extract/usr/share/espeak-ng-data/. app/src/main/assets/piper/espeak-ng-data/
          elif [ -d /tmp/piper-extract/data/data/com.termux/files/usr/share/espeak-ng-data ]; then
            cp -a /tmp/piper-extract/data/data/com.termux/files/usr/share/espeak-ng-data/. app/src/main/assets/piper/espeak-ng-data/
          fi

          chmod +x app/src/main/assets/piper/bin/piper
          test -d app/src/main/assets/piper/espeak-ng-data

      - name: Validate bundled assets
        run: |
          test -f app/src/main/assets/quotes.txt
          test -f app/src/main/assets/font.ttf || (echo "Missing font.ttf. Add your original font.ttf to app/src/main/assets/"; exit 1)
          test -f app/src/main/assets/bg.mp3 || (echo "Missing bg.mp3. Add your original bg.mp3 to app/src/main/assets/"; exit 1)

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BibleVerseVideoGenerator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
