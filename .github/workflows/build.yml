name: Build APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK / NDK / CMake
        shell: bash
        run: |

          set -euxo pipefail

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.31.6"


      - name: Download Piper source and ONNX Runtime
        shell: bash
        run: |

          set -euxo pipefail

          PIPER_VERSION="v1.4.2"
          ORT_VERSION="1.22.0"

          CPP="app/src/main/cpp"

          rm -rf "$CPP/piper"
          rm -rf "$CPP/onnxruntime"

          mkdir -p "$CPP"


          echo "================================"
          echo "CLONING PIPER"
          echo "================================"

          git clone \
            --depth 1 \
            --branch "$PIPER_VERSION" \
            --recurse-submodules \
            https://github.com/OHF-Voice/piper1-gpl.git \
            "$CPP/piper"


          echo "================================"
          echo "DOWNLOADING ANDROID ONNX RUNTIME"
          echo "================================"

          mkdir -p /tmp/ort

          curl \
            -L \
            --fail \
            --retry 3 \
            -o /tmp/ort/onnxruntime.aar \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${ORT_VERSION}/onnxruntime-android-${ORT_VERSION}.aar"


          unzip \
            -q \
            -o \
            /tmp/ort/onnxruntime.aar \
            -d "$CPP/onnxruntime"


          mkdir -p \
            "$CPP/onnxruntime/lib"


          cp \
            "$CPP/onnxruntime/jni/arm64-v8a/libonnxruntime.so" \
            "$CPP/onnxruntime/lib/libonnxruntime.so"


          test -f \
            "$CPP/onnxruntime/include/onnxruntime_cxx_api.h"


          test -f \
            "$CPP/onnxruntime/lib/libonnxruntime.so"


          echo "ONNX Runtime prepared."


      - name: Build Piper native library
        shell: bash
        run: |

          set -euxo pipefail

          CPP="$GITHUB_WORKSPACE/app/src/main/cpp"

          NDK="$ANDROID_NDK_ROOT"


          rm -rf \
            /tmp/piper-native-build


          echo "================================"
          echo "CONFIGURING PIPER"
          echo "================================"


          cmake \
            -S "$CPP/piper/libpiper" \
            -B /tmp/piper-native-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DONNXRUNTIME_DIR="$CPP/onnxruntime" \
            -DPIPER_BUILD_TESTS=OFF


          echo "================================"
          echo "BUILDING PIPER"
          echo "================================"


          cmake \
            --build /tmp/piper-native-build \
            --config Release \
            --parallel 2


          echo "================================"
          echo "CHECKING PIPER LIBRARY"
          echo "================================"


          find \
            /tmp/piper-native-build \
            -name "libpiper.so" \
            -print


          PIPER_SO=$(find \
            /tmp/piper-native-build \
            -name "libpiper.so" \
            | head -n 1)


          test -n "$PIPER_SO"


          echo "Piper library:"
          echo "$PIPER_SO"


          mkdir -p \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"


          cp \
            "$PIPER_SO" \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libpiper.so"


          cp \
            "$CPP/onnxruntime/lib/libonnxruntime.so" \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libonnxruntime.so"


      - name: Collect eSpeak NG data
        shell: bash
        run: |

          set -euxo pipefail

          DATA_DIR=$(find \
            /tmp/piper-native-build \
            -type d \
            -name "espeak-ng-data" \
            | head -n 1)


          if [ -z "$DATA_DIR" ]; then

            echo "ERROR: espeak-ng-data was not found."

            find \
              /tmp/piper-native-build \
              -maxdepth 5 \
              -type d \
              | sort

            exit 1

          fi


          echo "eSpeak data:"
          echo "$DATA_DIR"


          rm -rf \
            app/src/main/assets/piper/espeak-ng-data


          mkdir -p \
            app/src/main/assets/piper/espeak-ng-data


          cp -a \
            "$DATA_DIR/." \
            app/src/main/assets/piper/espeak-ng-data/


          test -f \
            app/src/main/assets/piper/espeak-ng-data/phonindex


      - name: Validate project
        shell: bash
        run: |

          set -euxo pipefail

          test -f \
            app/src/main/assets/quotes.txt

          test -f \
            app/src/main/assets/font.ttf

          test -f \
            app/src/main/assets/bg.mp3

          test -f \
            app/src/main/assets/piper/espeak-ng-data/phonindex

          test -f \
            app/src/main/jniLibs/arm64-v8a/libpiper.so

          test -f \
            app/src/main/jniLibs/arm64-v8a/libonnxruntime.so


          echo ""
          echo "================================"
          echo "NATIVE LIBRARIES"
          echo "================================"

          ls -lh \
            app/src/main/jniLibs/arm64-v8a/


          echo ""
          echo "================================"
          echo "ASSETS"
          echo "================================"

          find \
            app/src/main/assets \
            -maxdepth 3 \
            -type f \
            -printf "%p %s bytes\n" \
            | sort


      - name: Build debug APK
        shell: bash
        run: |

          set -euxo pipefail

          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --stacktrace \
            --no-daemon


      - name: Verify APK
        shell: bash
        run: |

          set -euxo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"


      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: BibleVerseVideoGenerator-debug

          path: app/build/outputs/apk/debug/app-debug.apk

          if-no-files-found: error
