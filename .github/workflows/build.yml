name: Build Bible Verse Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.31.6"

      - name: Prepare Piper and ONNX Runtime
        shell: bash
        run: |
          set -euxo pipefail

          PIPER_VERSION="v1.4.2"
          ORT_VERSION="1.22.0"
          CPP="app/src/main/cpp"

          rm -rf "$CPP/piper"
          rm -rf "$CPP/onnxruntime"

          mkdir -p "$CPP"

          echo "================================"
          echo "CLONING PIPER"
          echo "================================"

          git clone \
            --depth 1 \
            --branch "$PIPER_VERSION" \
            --recurse-submodules \
            https://github.com/OHF-Voice/piper1-gpl.git \
            "$CPP/piper"

          test -f \
            "$CPP/piper/libpiper/CMakeLists.txt"

          test -f \
            "$CPP/piper/libpiper/include/piper.h"

          echo "Piper source downloaded."

          echo "================================"
          echo "DOWNLOADING ANDROID ONNX RUNTIME"
          echo "================================"

          rm -rf /tmp/ort
          mkdir -p /tmp/ort

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -o /tmp/ort/onnxruntime.aar \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${ORT_VERSION}/onnxruntime-android-${ORT_VERSION}.aar"

          test -s \
            /tmp/ort/onnxruntime.aar

          echo "AAR downloaded:"
          ls -lh \
            /tmp/ort/onnxruntime.aar

          mkdir -p \
            "$CPP/onnxruntime"

          unzip \
            -q \
            -o \
            /tmp/ort/onnxruntime.aar \
            -d "$CPP/onnxruntime"

          echo "================================"
          echo "CHECKING ONNX RUNTIME AAR"
          echo "================================"

          test -f \
            "$CPP/onnxruntime/headers/onnxruntime_cxx_api.h"

          test -f \
            "$CPP/onnxruntime/jni/arm64-v8a/libonnxruntime.so"

          echo "ONNX headers found."

          echo "ONNX ARM64 library found."

          mkdir -p \
            "$CPP/onnxruntime/lib"

          cp \
            "$CPP/onnxruntime/jni/arm64-v8a/libonnxruntime.so" \
            "$CPP/onnxruntime/lib/libonnxruntime.so"

          test -f \
            "$CPP/onnxruntime/lib/libonnxruntime.so"

          # Piper's CMake expects:
          # onnxruntime/include
          # onnxruntime/lib
          #
          # Android AAR provides:
          # onnxruntime/headers
          # onnxruntime/lib

          ln -s \
            "headers" \
            "$CPP/onnxruntime/include"

          test -f \
            "$CPP/onnxruntime/include/onnxruntime_cxx_api.h"

          echo "================================"
          echo "ONNX RUNTIME READY"
          echo "================================"

          ls -lh \
            "$CPP/onnxruntime/include/onnxruntime_cxx_api.h"

          ls -lh \
            "$CPP/onnxruntime/lib/libonnxruntime.so"

      - name: Build Android APK
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      - name: Check APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================"
          echo "APK FILES"
          echo "================================"

          find \
            app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find \
            app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            -quit)"

          test -n "$APK"

          echo "APK:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BibleVerse-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
